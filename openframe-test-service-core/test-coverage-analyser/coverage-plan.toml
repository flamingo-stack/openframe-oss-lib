needs = []
source = "report 2026-09-30 #4"
notes = "The cheapest P1 in this report: RemoteAccessPolicyApi, RemoteAccessQueries and RemoteAccessPolicyTest already exist and already do exactly this at tenant scope, so the item is two constants and three methods. It also closes the hole RemoteAccessPolicyTest's own javadoc names ('a device or organization override still wins and would have to be cleared separately') — today the suite sets SILENT_ACCESS tenant-wide and an org or device override left behind by anyone silently re-parks every remote session, which is the failure mode that cost the qa nightly of 2026-09-25. Asserting the resolution order device → organization → tenant is the point of the case. Two different error conventions in one file: setOrganizationRemoteAccessMode returns OrganizationRemoteAccessPolicyPayload with userErrors (ORGANIZATION_NOT_FOUND, REMOTE_ACCESS_DISABLED) like the tenant mutation, while setDeviceRemoteAccessMode returns Machine! and raises DEVICE_NOT_FOUND / REMOTE_ACCESS_DISABLED as GraphQL errors with extensions.code. mode:null clears an override at both scopes — that is the restore path, and OrganizationRemoteAccessPolicy.mode null vs effectiveMode is how you prove the clear worked. The device override reads back on Machine.remoteAccess { mode effectiveMode effectiveScope }, an extension on the oss-lib Machine type, so DeviceQueries needs the selection added. Use the throwaway organization pattern from AiSettingsTest for the org scope; run it under the existing remote-access-setup/teardown tags only if the mode has to outlive the class, otherwise plain feature tags keep it in the functional phase."

[[items]]
id = "CP-25"
title = "Remote-access request and session lifecycle"
status = "proposed"
priority = "P1"
ops = [
  "mutation:createRemoteAccessRequest", "mutation:revokeRemoteAccessRequest", "query:remoteAccessRequest",
  "mutation:endRemoteSession", "query:remoteSession", "query:activeRemoteSession",
  "query:remoteSessions", "query:remoteAccessRequests",
]
test_class = "RemoteAccessSessionTest"
tags = ["saas", "feature", "needs-device"]
depends_on = ["CP-24"]
needs = [
  "decision: reaching a RemoteSession at all needs a request to become APPROVED, and the approval is answered by the end user in openframe-chat or by the machine over REST on openframe-saas-client (POST api/v1/remote-access/requests/{id}/approve, machine token from Rust — itself an open gap-api row). Options: (a) set the device to SILENT_ACCESS via CP-24 and see whether a request auto-approves into a session, (b) drive the machine-side approve endpoint with the agent token the way the Fae suite gets a machine identity, (c) cover the request half only and leave session ops to the Playwright DeviceRemoteTest",
]
source = "report 2026-09-30 #5"
notes = "The request half needs no approval and is worth doing even if the decision lands on (c): createRemoteAccessRequest → remoteAccessRequest(requestId) → revokeRemoteAccessRequest is a closed loop, and the schema pins the refusal codes as userErrors on RemoteAccessRequestPayload (DEVICE_HAS_LIVE_REQUEST, DEVICE_HAS_ACTIVE_SESSION, DEVICE_UNREACHABLE, REMOTE_ACCESS_DISABLED, DEVICE_NOT_FOUND, REMOTE_ACCESS_REQUEST_NOT_FOUND, REMOTE_ACCESS_FORBIDDEN, REMOTE_ACCESS_REQUEST_SETTLED). Two cheap negatives fall straight out of that list: a second create on the same device returns the caller's own live request with created:false rather than a new one, and revoke on an already-settled request answers REMOTE_ACCESS_REQUEST_SETTLED with the settled request attached. Set the device to DENY_ACCESS through CP-24 to get REMOTE_ACCESS_DISABLED deterministically. deviceId is the OpenFrame machine id (the ?id= value on the device pages), not a global id. requestId/sessionId are plain 26-char ULIDs, not Relay ids. The read-side ops remoteSessions/remoteAccessRequests are per-device audit connections, clamped first 1..100 default 20, and are legitimately empty on a device nothing has connected to — assert the connection shape and totalCount, not a row. activeRemoteSession returns null for another technician's session on purpose, so an empty answer is never proof of absence. Ordered before the `device` phase would collide with DeviceRemoteTest, which opens real sessions on the same box — keep this in functional and pick a request the class revokes itself."

[[items]]
id = "CP-26"
title = "Directory connection lifecycle (no IdP account needed)"
status = "proposed"
priority = "P1"
ops = [
  "query:directoryConnections", "query:directoryConnection", "query:directoryConnectionOptions",
  "query:directoryConnectionOrganizations", "mutation:createDirectoryConnection",
  "mutation:updateDirectoryConnection", "mutation:startDirectoryConsent",
  "mutation:checkDirectoryConnection", "mutation:deleteDirectoryConnection",
]
test_class = "DirectoryConnectionsTest"
tags = ["saas", "feature"]
depends_on = []
needs = ["decision: confirm that a DISCONNECTED connection is safe to create and delete on the qa tenant — deleteDirectoryConnection is documented as irreversible and best-effort revokes the provider grant, but a connection that never reached consent has no synced users, groups, devices or audit rows to delete and no grant to revoke, so the blast radius should be the connection document alone"]
source = "report 2026-09-30 #3"
notes = "The reason this is reachable without a Google/Microsoft account, and the fact an implementer must not miss: createDirectoryConnection persists the connection in DISCONNECTED state before any consent, and checkDirectoryConnection is explicit that 'an unreachable provider is an answer, not an error' — the mutation succeeds and access.state carries the verdict. So the whole CRUD ring is assertable with no IdP: create (assert DISCONNECTED, directoryId/grantedBy/connectedAt all null), read it back by id and find it in the paged list by search, rename and move it to another customer, re-mint the consent link, probe it and read access { state reason checkedAt capabilities }, delete it and confirm it is gone. Two specified oddities are the negative cases: consentUrl may legitimately be null right after create when the provider was unreachable at that moment (the connection is still real — startDirectoryConsent retries the link), and the domain edit is accepted only while connectedAt is null, answering a userError otherwise. Which providers are even offerable is deployment-gated — read directoryConnectionOptions.providers first and self-skip when it is empty rather than hardcoding GOOGLE_WORKSPACE. directoryConnectionOrganizations lists only active customers not already linked to any connection of any provider, so the customer created for the test must come from that list or the create will not be reproducible; name is unique per tenant+provider, so namespace it with RunId. Pager contract worth pinning: totalCount comes from the search index and can exceed the edges actually returned, so page until pageInfo.hasNextPage is false — the schema says so twice."

[[items]]
id = "CP-27"
title = "Software inventory and vulnerability reads (fleet-wide)"
status = "proposed"
priority = "P2"
ops = [
  "query:softwares", "query:software", "query:softwareFilters",
  "query:softwareDevices", "query:softwareDeviceFilters", "query:softwareVulnerabilities",
  "query:vulnerabilities", "query:vulnerability", "query:vulnerabilityFilters", "query:vulnerabilityDevices",
]
test_class = "SoftwareInventoryTest"
tags = ["saas", "feature"]
depends_on = []
needs = ["precondition: the whole read side is a thin proxy over Fleet MDM REST, and configs/base/openframe-saas-test.yml records that FLEET_MDM has not reached CONNECTED on any device since at least 2026-08-14 (require-fleet-connection is pinned false for exactly that reason). Decide whether these cases assert on real rows — which needs Fleet back — or assert the connection/facet contract and self-skip the row assertions on an empty fleet"]
source = "report 2026-09-30 #8"
notes = "Read-only, so the risk is entirely 'does the data exist', not 'what does it break'. Verified enabled on qa: openframe.rmm.software.enabled true (configs/qa/openframe-saas-api.yml:29) — the resolvers are @Conditional on it, so on a deployment where it is off these fields are absent from the schema, not empty. Follow LogsTest, which already asserts a connection against its own facets. Boundary case the schema hands you for free: 'an unknown sort field is rejected as a client error (BAD_REQUEST), not a server error' on softwares, and the sortable set is exactly name/devicesCount/cveCount/highestSeverity. vulnerability(cveId) is the one op with a recent fix behind it — 03944fa32 2026-09-25 'Fixed: VulnerabilityByCVE does not provide Softwares and Devices' — so the assertion that earns its keep is that a CVE taken from the vulnerabilities list resolves affectedSoftware and that vulnerabilityDevices(cveId) is non-empty for it; those are the two fields that regressed. Detail-only fields (description, resolvedInVersion, affectedSoftware) are null on list rows by design, so read them from the by-id query and not from the connection. software(id) and softwares take Relay global ids; vulnerability/vulnerabilityDevices key on the plain CVE string."

[[items]]
id = "CP-28"
title = "Device-scoped software and vulnerability reads"
status = "proposed"
priority = "P2"
ops = [
  "query:deviceSoftware", "query:deviceSoftwareFilters",
  "query:deviceVulnerabilities", "query:deviceVulnerabilityFilters",
]
test_class = "SoftwareInventoryTest"
tags = ["saas", "feature", "needs-device"]
depends_on = ["CP-27"]
needs = []
source = "report 2026-09-30 #8"
notes = "Split from CP-27 only because these four need a device and the fleet-wide ten do not — same client and same Queries class, so it is one PR's worth together if a device is in hand. All four take a raw machineId (String!, not a global id) and all four specify the same two boundaries, which is the whole negative half of the item: an unknown machineId is NOT_FOUND, a known device with nothing installed / no CVEs is an empty connection or empty facets, never an error. Device-scope subtlety to assert rather than assume: Software.currentVersion is the version installed on *this* device while devicesCount stays fleet-wide, and deviceVulnerabilities populates affectedSoftware on every row scoped to this host. deviceVulnerabilityFilters is the only one of the four the UI does not call yet (gap-api) — it is in here because it shares the fixture, not because a screen needs it."

[[items]]
id = "CP-29"
title = "Software action history"
status = "proposed"
priority = "P2"
ops = [
  "query:softwareActions", "query:softwareAction", "query:softwareActionFilters", "query:softwareActionExecutions",
]
test_class = "SoftwareActionHistoryTest"
tags = ["saas", "feature"]
depends_on = []
needs = ["precondition: there is no action history until something installs or updates software, which is CP-23 (submitSoftwareBundle) or the KG-13 installSoftware/updateSoftware mutations. Until one of those runs, this area can only be asserted as an empty connection against its own facets"]
source = "report 2026-09-30 (unplanned-gap sweep)"
notes = "Exactly the shape of CP-17 (ScriptExecutionHistoryTest), which solved the same 'history of something nobody dispatched' problem by preferring a subject that already has history and falling back to an own subject whose empty history is legitimate — reuse that structure rather than inventing one. Sequence the item after CP-23 if the owner takes option (a) there, since a submitted bundle is the cheapest way to mint one real row. softwareActionExecutions is gap-api (no UI consumer yet); the other three are UI-used from the software screens."

[[items]]
id = "CP-30"
title = "Per-organization AI config and guardrails"
status = "proposed"
priority = "P1"
ops = [
  "query:organizationClientAiConfig", "mutation:updateOrganizationClientAiConfig",
  "mutation:resetOrganizationClientAiConfig", "mutation:resetOrganizationClientAiQuickActions",
  "query:organizationGuardrails", "mutation:updateOrganizationGuardrails", "mutation:resetOrganizationGuardrails",
]
test_class = "AiSettingsTest"
tags = ["saas", "feature"]
depends_on = ["CP-8"]
needs = ["decision: updateOrganizationGuardrails needs templateId — the server _id of a TEMPLATE policy from the tenant preset list — and the tenant preset list is read through AIPolicyController, whose whole surface is deferred under KG-15 pending a new API version. Either the guardrails half borrows that deferred endpoint as a fixture (the way KG-2 suggests the test-clock endpoints be used), or it waits for the replacement and this item ships the four organizationClientAiConfig ops alone"]
source = "report 2026-09-30 #6"
notes = "CP-8 already built the whole fixture and the pattern: AiSettingsApi, AiSettingsQueries and AiSettingsTest read the tenant-wide configs and write them back unchanged, and already create a throwaway organization, override its clientView, partially update it, reset it and archive the organization afterwards — these seven ops are the same operations one scope down, on the same throwaway org. That makes it the highest-value-per-line P1 in this report. Both reset mutations and the update are per-organization, so nothing tenant-wide is touched and the archive at the end disposes of the evidence. The guardrails inherit/override model is what to assert: organizationGuardrails reports inheritDefault true with the *tenant* rules showing through while the org has no policy of its own, update materializes an org policy from a template plus per-operation overrides keyed by GuardrailRule.naturalKey, and resetOrganizationGuardrails puts inheritDefault back to true — so the round trip is provable without knowing the rule set. Guardrails refusals come back as userErrors on OrganizationGuardrailsPayload; SecurityApprovalLevel is ALLOW/ASK_USER/ASK_TECHNICIAN/DENY in declaration order. resetOrganizationClientAiQuickActions is narrower than resetOrganizationClientAiConfig — reset the quick actions alone and assert the rest of the config survives, which is the only thing that distinguishes the two ops."

[[items]]
id = "CP-31"
title = "User onboarding progress"
status = "proposed"
priority = "P2"
ops = [
  "query:userOnboardingProgress", "mutation:completeUserOnboardingStep", "mutation:completeUserOnboarding",
  "mutation:skipUserOnboarding", "mutation:resetUserOnboarding",
]
test_class = "OnboardingTest"
tags = ["saas", "feature"]
depends_on = []
needs = []
source = "report 2026-09-30 #9"
notes = "The one thing that makes this safe and that the tenant flow (CP-32) lacks: resetUserOnboarding exists and is specified as 'reset personal onboarding to a clean state (no steps, not skipped, not completed)', so the whole walk is reversible and the record is per (userId, tenantId) — scoped to the suite's own admin, invisible to anyone else on a shared tenant. Reset first, walk the six UserOnboardingStep values through completeUserOnboardingStep asserting idempotence (the schema says idempotent, so calling one twice must not duplicate it in completedSteps), finish with completeUserOnboarding and assert completed plus completedAt, then reset and assert the clean state; skipUserOnboarding sets skipped/skippedAt and is cleared by reset. No order guarantee on completedSteps, so compare as a set. Every mutation returns the full progress object and no userErrors wrapper, so one round trip per assertion and refusals would be top-level errors. Nothing here is derived: the schema is explicit that the store is the single source of truth and that 'a customer exists / a device exists' are frontend auto-complete triggers only — so a test must not expect a step to complete itself."

[[items]]
id = "CP-32"
title = "Tenant onboarding progress"
status = "proposed"
priority = "P2"
ops = [
  "query:tenantOnboardingProgress", "mutation:completeTenantOnboardingStep", "mutation:completeTenantOnboarding",
]
test_class = "OnboardingTest"
tags = ["saas", "feature"]
depends_on = ["CP-31"]
needs = ["decision: the tenant flow has no reset — completeTenantOnboarding sets the tenant's definitive 'onboarded' marker for every admin of the tenant and nothing in the schema undoes it. Options: restrict the case to pipeline-registered tenants (which start with no record) and self-skip on long-lived ones, or cover the read and the idempotent per-step mutation only and leave the terminal Complete uncovered"]
source = "report 2026-09-30 #9 (split out of CP-31 on purpose)"
notes = "Split from CP-31 purely on reversibility: 'Initial Setup (tenant): one record per tenant, not skippable, ended by an explicit Complete', shared across all admins. completeTenantOnboardingStep is idempotent and marks one of MSP_SETUP / CUSTOMERS_SETUP / DEVICE_MANAGEMENT / MEET_MINGO, so even the step half writes tenant-wide state a human would see in the dashboard. tenantOnboardingProgress is a safe read anywhere and could ship on its own."

[[items]]
id = "CP-33"
title = "Notification settings"
status = "proposed"
priority = "P2"
ops = ["query:notificationSettings", "mutation:updateNotificationSettings"]
test_class = "NotificationsTest"
tags = ["saas", "feature"]
depends_on = ["CP-5"]
needs = []
source = "report 2026-09-30 (unplanned-gap sweep)"
notes = "Cheapest item in the batch and it extends a class that is already done (CP-5), in the area whose read/delete half is fully covered. Follow the CP-8 write-back-unchanged pattern, which suits this contract exactly: notificationSettings returns every NotificationSettingGroup exactly once with defaults already resolved, so the round trip is read → flip one group → assert only that group moved → write the original back. Two things to pin: 'the modal saves full state; omitting typeSettings keeps the stored group overrides', so a call with enabled alone must leave typeSettings untouched — that is the negative case; and NotificationTypeSetting.label is server-rendered caption text the client never maps from the enum, so assert it is non-blank rather than matching a string. enabled is a master switch over in-app and push alike, so leave it true and restore it in a finally — a run that dies with it false mutes the inbox the CP-5 cases depend on."

[[items]]
id = "CP-34"
title = "Package catalog search"
status = "proposed"
priority = "P2"
ops = ["query:searchPackages", "query:packageDetails"]
test_class = "PackageSearchTest"
tags = ["saas", "feature"]
depends_on = []
needs = []
source = "report 2026-09-30 (unplanned-gap sweep)"
notes = "Read-only and needs no tenant state at all — no device, no organization, nothing to clean up — but it reaches out to Homebrew / Chocolatey / winget, so it is the one case in the suite that fails when the *public* internet is unavailable rather than when the product is broken; say so in the @DisplayName or accept the flake. The contract gives the whole test: PackageSearchItem.id is what packageDetails takes, packageType must be passed back for BREW or you may open the formula's cask twin, packageDetails errors NOT_FOUND on an unknown id (the negative case), versions come newest first, and forward cursor pagination only — pass pageInfo.endCursor back as after. Per-manager gaps are specified and must not be asserted away: publisher is WINGET-only in search results, iconUrl CHOCO-only in search, popularity BREW/CHOCO only, releasedAt Chocolatey only. Homebrew publishes only the current version, so a 'more than one version' assertion has to pick CHOCO. This is also the fixture CP-22/CP-23 need — a bundle's packages must be identified 'exactly as package search returns it' — so doing it first pays twice."

[[items]]
id = "CP-35"
title = "Dialog unread counter and mode"
status = "proposed"
priority = "P2"
ops = ["mutation:markDialogMessagesRead", "PATCH api/v1/dialogs/{}/mode", "PATCH api/v1/dialogs/{}/status"]
test_class = "DialogsTest"
tags = ["saas", "feature"]
depends_on = ["CP-16"]
needs = ["precondition: markDialogMessagesRead 'zeroes the caller's side of the unread message counter. Clients reset the client side, technicians the shared admin side' — so an admin session can only zero the admin side, and the counter is only non-zero if the other side has written. Decide whether the case mints that with a client/Fae dialog (which puts it in the fae phase like CP-4) or asserts the idempotent zero-to-zero write from an admin session in the functional phase"]
source = "report 2026-09-30 (unplanned-gap sweep)"
notes = "Extends DialogsTest (CP-16, done), whose own note records the trap to avoid: DialogApi's REST path constant DIALOGS shadowed the GraphQL document of the same name, so the document is DIALOGS_QUERY — the same collision is waiting for the two PATCH endpoints added here. markDialogMessagesRead returns DialogPayload { dialog, userErrors } and takes DialogIdInput { id }, the same input as archiveDialog/unarchiveDialog which the class already drives. PATCH api/v1/dialogs/{id}/mode is the newer of the two (2026-08-27) and is called from the tickets screen; PATCH .../status is gap-api and rides along on the same client. Read the two controller signatures at the pinned SHA before writing the DTOs — this item's contract is the one in the batch that was not verified for this report."

[[items]]
id = "CP-36"
title = "SSO provider configuration (REST)"
status = "proposed"
priority = "P2"
ops = [
  "GET sso/providers", "GET sso/providers/available", "GET sso/{}", "POST sso/{}", "PATCH sso/{}/toggle",
  "PUT sso/{}", "DELETE sso/{}",
]
test_class = "SsoConfigTest"
tags = ["saas", "feature"]
depends_on = []
needs = ["decision: a saved SSO provider configuration is tenant-wide login surface. Creating one on the qa tenant and toggling it on could offer a broken SSO button on the login page to everyone using that tenant until the test deletes it. Options: create it and leave enabled false (PATCH .../toggle then asserts the flag alone, never a real login), or restrict the class to pipeline-registered tenants"]
source = "report 2026-09-30 #10"
notes = "Read the whole controller first — it is small and the matrix is wrong about it. SSOConfigController (openframe-api-service-core/src/main/java/com/openframe/api/controller/SSOConfigController.java, @RequestMapping(\"/sso\")) has seven mappings: GET /providers, GET /providers/available, GET /{provider}, POST /{provider}, PUT /{provider}, PATCH /{provider}/toggle, DELETE /{provider}. The matrix reports PUT and DELETE as covered, and they are not: no file under api/ mentions SSO at all (verified with git grep -i sso over the test library at bafecbfea). The two rows collided by path shape with OrganizationApi's PUT organizations/{id} and the admin teardown's DELETE users/{id}. So this item is really the whole controller, and PUT/DELETE should be added to its ops once the owner confirms the false positive — the run may not edit an existing item's ops, and these two are not in any item's ops today. DTOs are named in the signatures: SSOConfigStatusResponse (list), SSOProviderInfo (available), SSOConfigResponse (get/save/update), SSOConfigRequest (@Valid body — so a malformed body is the 400 negative case). GET /providers/available is the safest first assertion: it lists what this deployment supports and writes nothing. 2026-09-30, after the analyser fix (76c8e11f1): the false positive is confirmed and fixed — PUT and DELETE now read gap-ui — so both are added to ops and the item covers all seven mappings. DELETE is the cleanup for POST."

[[items]]
id = "CP-37"
title = "Item assignment"
status = "proposed"
priority = "P2"
ops = [
  "query:assignedItems", "query:assignedItemCounts",
  "mutation:assignItem", "mutation:unassignItem", "mutation:unassignAllByType",
]
test_class = "AssignmentsTest"
tags = ["saas", "feature"]
depends_on = []
needs = []
source = "report 2026-09-30 (unplanned-gap sweep)"
notes = "A small generic join table over things the suite already creates, which is what makes it cheap: AssignmentItemType is TICKET / KNOWLEDGE_ARTICLE / INSIGHT and AssignmentTargetType is ORGANIZATION / DEVICE / TICKET / KNOWLEDGE_ARTICLE, so TicketsTest and KnowledgeBaseTest fixtures supply both ends and nothing new has to be minted. Every id is a Relay global id (itemId, targetId, and ItemAssignment.id). assignItem returns ItemAssignment; unassignItem and unassignAllByType return plain Boolean, so the idempotence question — is the second unassign false? — is the negative case, the same shape as deleteTimeEntry in CP-6. assignedItemCounts is a per-targetType roll-up of assignedItems and the two must agree: that cross-check is the assertion worth writing. Oldest surface in this batch (2026-05-01) and the only one of the three assignment ops the UI calls that has sat uncovered for five months. Note the federation seam: assignment.graphqls declares its own trimmed Ticket type with a TODO to delete it after the Apollo Federation migration, so a Ticket read through this schema carries fewer fields than the same ticket read on the ai-agent side — do not reuse the ai-agent Ticket DTO here."

[[items]]
id = "CP-38"
title = "Tenant info and the global domain"
status = "proposed"
priority = "P2"
ops = [
  "query:tenantInfo", "mutation:updateTenantInfo", "GET config/global/domain", "POST config/global/domain",
]
test_class = "TenantInfoTest"
tags = ["saas", "feature"]
depends_on = []
needs = ["decision: POST config/global/domain writes the deployment's global domain — read the controller before touching it, because if it is genuinely global rather than per-tenant it is not something a nightly may write on a shared cluster at all, and only the GET belongs in this item"]
source = "report 2026-09-30 (unplanned-gap sweep)"
notes = "Both pairs sit behind the settings screen and both are read/write pairs, so the CP-8 write-back-unchanged pattern applies to each. query:tenantInfo lives in openframe-saas-web-common (a SAAS_LIB_REPO module) while mutation:updateTenantInfo lives in openframe-saas-api — the read and the write are in different repos, so a schema change to one is exactly the drift this pair would catch. The GlobalConfigController half is unverified for this report: read the two mappings and their DTOs at the pinned SHA first. Keep tenantInfo's read in even if the domain half is dropped — it is the field the onboarding and settings screens both open with."

[[items]]
id = "CP-39"
title = "Assistant AI configuration (REST)"
status = "proposed"
priority = "P2"
ops = ["GET api/v1/ai-configuration", "POST api/v1/ai-configuration", "POST api/v1/ai-configuration/test"]
test_class = "AiSettingsTest"
tags = ["saas", "feature"]
depends_on = ["CP-8"]
needs = ["decision: POST api/v1/ai-configuration writes the tenant's AI provider configuration, and POST .../test probes the configured provider — probably with real credentials and a real model call. Confirm the test endpoint is safe to call on qa and does not bill a live provider key"]
source = "report 2026-09-30 (unplanned-gap sweep)"
notes = "The sibling GET api/v1/ai-configuration/supported-models is already covered — the AI suites reach it through a helper during the model-switch cases — so the client class and the auth path exist and only these three mappings are missing. Same controller, same base path, so this is a small extension rather than a new client. The GET is a safe read and can ship alone. Read AIConfigurationController at the pinned SHA for the DTO names; not verified for this report. The GraphQL twins of this surface (adminAiConfig/clientAiConfig) are covered by CP-8, so if the two representations disagree about a tenant's configuration, this item is what would show it."

[[items]]
id = "CP-40"
title = "Ad-hoc script and command dispatch"
status = "proposed"
priority = "P2"
ops = [
  "mutation:runScript", "mutation:batchRunScript", "mutation:runCommand",
  "mutation:batchRunCommand", "mutation:cancelExecution",
]
test_class = "ScriptsTest"
tags = ["saas", "feature", "needs-device"]
depends_on = []
needs = ["decision: all five actually execute on the enrolled box. The suite already runs scripts on it through the assistant (MingoDeviceTest), so the precedent exists; what is needed is agreement that the functional phase may dispatch directly, and a harmless payload (an echo on Windows). cancelExecution is only assertable if a long-running script can be caught before it finishes, which may not be reliable"]
source = "report 2026-09-30 (unplanned-gap sweep)"
notes = "ScriptApi.runScript already exists and no enabled test calls it — it is one of the 25 unreached client methods, and the only one of them whose operation is an open UI-used gap. So mutation:runScript is the cheapest single op left in the matrix: the fixture is written and waiting for an assertion. The other four need new methods. runScript/batchRunScript are called from the scripts screen (batchRunScript since 2026-06-23, runScript since 2026-06-17); runCommand (2026-06-02) is the ad-hoc terminal and is UI-used, while batchRunCommand and cancelExecution are gap-api and ride along on the same client. Closing these also gives CP-17's script-execution history real rows to read instead of borrowing whatever the AI suites happened to leave behind, so sequence it before any further execution-history work."

[[items]]
id = "CP-41"
title = "External API v1 knowledge base: items, folders and tags"
status = "proposed"
priority = "P3"
ops = [
  "GET api/v1/knowledge-base/items", "GET api/v1/knowledge-base/items/{}",
  "POST api/v1/knowledge-base/items/{}/move", "POST api/v1/knowledge-base/items/{}/tags/{}",
  "DELETE api/v1/knowledge-base/items/{}/tags/{}", "GET api/v1/knowledge-base/folders",
  "POST api/v1/knowledge-base/folders", "PATCH api/v1/knowledge-base/folders/{}",
  "DELETE api/v1/knowledge-base/folders/{}", "GET api/v1/knowledge-base/tags",
]
test_class = "ExternalKnowledgeBaseTest"
tags = ["external-api"]
depends_on = []
needs = []
source = "report 2026-09-30 (largest untested external-consumer surface)"
notes = "KnowledgeBaseController in openframe-external-api-service-core is 20 endpoints, all introduced 2026-09-21, none touched by any test and none under a known-gaps entry — the largest single block of external-consumer surface in the matrix with no safety net. Split in two for one PR each; this half is the tree and the taxonomy, CP-42 is the article lifecycle. The external suite's whole harness already exists (tests/external/, api/external/, ExternalApiBaseTest, the X-API-Key clients) and the GraphQL twins of these operations are the best-covered area in the product — knowledge-base is 24/24 covered by KnowledgeBaseTest — so the assertions can be lifted from there and only the transport changes. Two constraints the external suite already encodes and this must not forget: the qa external API key is limited to 5 requests per minute (which is why the existing external tests carry a pacing layer), and external display names start with 'ExtApi: '. Tag external-api so it lands in that phase, which runs last, after the admin that mints the key still exists."

