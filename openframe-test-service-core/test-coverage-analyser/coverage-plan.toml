notes = "Split from CP-27 only because these four need a device and the fleet-wide ten do not — same client and same Queries class, so it is one PR's worth together if a device is in hand. All four take a raw machineId (String!, not a global id) and all four specify the same two boundaries, which is the whole negative half of the item: an unknown machineId is NOT_FOUND, a known device with nothing installed / no CVEs is an empty connection or empty facets, never an error. Device-scope subtlety to assert rather than assume: Software.currentVersion is the version installed on *this* device while devicesCount stays fleet-wide, and deviceVulnerabilities populates affectedSoftware on every row scoped to this host. deviceVulnerabilityFilters is the only one of the four the UI does not call yet (gap-api) — it is in here because it shares the fixture, not because a screen needs it. Done 2026-10-01 (#2500): SoftwareInventoryTest device cases; vm115982 has no CVEs, the row assertions run on an affected device; proved by the matrix."

