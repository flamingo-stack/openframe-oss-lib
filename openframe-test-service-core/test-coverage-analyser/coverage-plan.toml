notes = "Done 2026-09-13: NotificationsTest, 4 cases, green on qa test-env in ~9 s; also covers hasUnreadNotifications. Decision (owner, 2026-09-13): the bulk operations run on every tenant, the shared one included — the last case empties the test user's inbox. The product never notifies a user about their own actions (ticket assignment and status changes skip the actor), so the class cannot mint a notification for itself: 'Mark a notification read, then delete it' works on whatever the inbox holds and self-skips with a reason when it is empty (expected on a fresh nightly tenant and after this class has run once). The Relay node field does not resolve Notification ('Unknown Node type'), so single notifications are found through the list with a title search."

