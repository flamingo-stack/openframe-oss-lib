[[items]]
id = "CP-30"
title = "Per-organization AI config and guardrails"
status = "done"
priority = "P1"
ops = [
  "query:organizationClientAiConfig", "mutation:updateOrganizationClientAiConfig",
  "mutation:resetOrganizationClientAiConfig", "mutation:resetOrganizationClientAiQuickActions",
  "query:organizationGuardrails", "mutation:updateOrganizationGuardrails", "mutation:resetOrganizationGuardrails",
]
test_class = "AiSettingsTest"
tags = ["saas", "feature"]
depends_on = ["CP-8"]
needs = []
source = "report 2026-09-30 #6"
pr = "#2496"
notes = "CP-8 already built the whole fixture and the pattern: AiSettingsApi, AiSettingsQueries and AiSettingsTest read the tenant-wide configs and write them back unchanged, and already create a throwaway organization, override its clientView, partially update it, reset it and archive the organization afterwards — these seven ops are the same operations one scope down, on the same throwaway org. That makes it the highest-value-per-line P1 in this report. Both reset mutations and the update are per-organization, so nothing tenant-wide is touched and the archive at the end disposes of the evidence. The guardrails inherit/override model is what to assert: organizationGuardrails reports inheritDefault true with the *tenant* rules showing through while the org has no policy of its own, update materializes an org policy from a template plus per-operation overrides keyed by GuardrailRule.naturalKey, and resetOrganizationGuardrails puts inheritDefault back to true — so the round trip is provable without knowing the rule set. Guardrails refusals come back as userErrors on OrganizationGuardrailsPayload; SecurityApprovalLevel is ALLOW/ASK_USER/ASK_TECHNICIAN/DENY in declaration order. resetOrganizationClientAiQuickActions is narrower than resetOrganizationClientAiConfig — reset the quick actions alone and assert the rest of the config survives, which is the only thing that distinguishes the two ops. Owner decision 2026-10-01: borrow the deferred AI-policies endpoint read-only to obtain the template id; KG-15 stays deferred for coverage purposes. Done 2026-10-01 (#2496): AiSettingsTest on a throwaway organization; the guardrail template id is read from the deferred policies endpoint; proved by the matrix."

[[items]]
id = "CP-31"
title = "User onboarding progress"
status = "done"
priority = "P2"
ops = [
  "query:userOnboardingProgress", "mutation:completeUserOnboardingStep", "mutation:completeUserOnboarding",
  "mutation:skipUserOnboarding", "mutation:resetUserOnboarding",
]
test_class = "OnboardingTest"
tags = ["saas", "feature"]
depends_on = []
needs = []
source = "report 2026-09-30 #9"
pr = "#2489"
notes = "The one thing that makes this safe and that the tenant flow (CP-32) lacks: resetUserOnboarding exists and is specified as 'reset personal onboarding to a clean state (no steps, not skipped, not completed)', so the whole walk is reversible and the record is per (userId, tenantId) — scoped to the suite's own admin, invisible to anyone else on a shared tenant. Reset first, walk the six UserOnboardingStep values through completeUserOnboardingStep asserting idempotence (the schema says idempotent, so calling one twice must not duplicate it in completedSteps), finish with completeUserOnboarding and assert completed plus completedAt, then reset and assert the clean state; skipUserOnboarding sets skipped/skippedAt and is cleared by reset. No order guarantee on completedSteps, so compare as a set. Every mutation returns the full progress object and no userErrors wrapper, so one round trip per assertion and refusals would be top-level errors. Nothing here is derived: the schema is explicit that the store is the single source of truth and that 'a customer exists / a device exists' are frontend auto-complete triggers only — so a test must not expect a step to complete itself. Done 2026-10-01 (#2489): OnboardingTest, 10 cases; restores the shared user's progress (its original skippedAt stamp could not be written back); proved by the matrix."

