[[items]]
id = "CP-22"
title = "Software bundle staging lifecycle"
status = "proposed"
priority = "P1"
ops = [
  "query:softwareBundle", "mutation:createSoftwareBundle",
  "mutation:addDevicesToSoftwareBundle", "mutation:removeDevicesFromSoftwareBundle",
  "mutation:addAllDevicesToSoftwareBundle", "mutation:removeAllDevicesFromSoftwareBundle",
  "mutation:deleteSoftwareBundle",
]
test_class = "SoftwareBundleTest"
tags = ["saas", "feature", "needs-device"]
depends_on = []
needs = []
source = "report 2026-09-30 #2"
notes = "Nothing here dispatches: a bundle stays PENDING until submitSoftwareBundle (CP-23), and a PENDING bundle is disposable — configs/qa/openframe-saas-api.yml pins openframe.rmm.software.bundle.pending-ttl to 1h, so even a leaked draft is reaped. Verified live on qa: openframe.rmm.software.enabled is true (configs/qa/openframe-saas-api.yml:29). machineIds are Machine *global* ids here (schema: 'machineIds are Machine global ids'), while softwares/deviceSoftware take the raw machineId — the one place in the area where the two id shapes sit side by side, so use helpers/RelayIds. The add/remove-all pair takes the same filter+search as the bundle's own availableDevices field, so the natural assertion is availableDevices/assignedDevices deviceCount before and after. Idempotence is specified and worth asserting: re-adding an assigned id is skipped, removing an unassigned one is a no-op, deleteSoftwareBundle on an unknown or reaped id returns true and never throws, and on a COMPLETED bundle returns false. ScriptScheduleDevicesTest is the template for the device-targeting half."

[[items]]
id = "CP-23"
title = "Submit a software bundle"
status = "proposed"
priority = "P1"
ops = ["mutation:submitSoftwareBundle"]
test_class = "SoftwareBundleTest"
tags = ["saas", "feature"]
depends_on = ["CP-22"]
needs = ["decision: submitSoftwareBundle with schedule:null installs real packages on the assigned devices immediately (one RMM execution per package over the software NATS pipe). Options: (a) submit with a schedule far enough out that nothing fires and delete the resulting software schedule, which is what ScriptScheduleTest does for scripts; (b) submit run-now against a harmless package on the pipeline box; (c) leave submit uncovered and accept that the bundle screen's terminal step is untested"]
source = "report 2026-09-30 #2 (split out of CP-22 on purpose)"
notes = "Option (a) looks right and covers the more interesting branch: SoftwareBundleScheduleInput carries the same fields and rules as CreateSoftwareScheduleInput minus action/packages/machineIds, so submit-with-schedule creates a software schedule (SoftwareBundle.scheduleId) whose lifecycle ops are deferred under KG-13 — closing this op would give that area its first reachable entry point and is a reason to revisit KG-13. Validate → mark COMPLETED is the only path to status COMPLETED, which is also the precondition for CP-22's 'deleteSoftwareBundle on a COMPLETED bundle returns false' case, so the two items interlock."

