notes = "Cheapest item in the batch and it extends a class that is already done (CP-5), in the area whose read/delete half is fully covered. Follow the CP-8 write-back-unchanged pattern, which suits this contract exactly: notificationSettings returns every NotificationSettingGroup exactly once with defaults already resolved, so the round trip is read → flip one group → assert only that group moved → write the original back. Two things to pin: 'the modal saves full state; omitting typeSettings keeps the stored group overrides', so a call with enabled alone must leave typeSettings untouched — that is the negative case; and NotificationTypeSetting.label is server-rendered caption text the client never maps from the enum, so assert it is non-blank rather than matching a string. enabled is a master switch over in-app and push alike, so leave it true and restore it in a finally — a run that dies with it false mutes the inbox the CP-5 cases depend on. 2026-10-01: the product fix (362d02da0, INSIGHTS added to notification-settings.graphqls) reached qa and the four cases in #2486 passed in order; merged."

[[items]]
id = "CP-34"
title = "Package catalog search"
status = "done"
priority = "P2"
ops = ["query:searchPackages", "query:packageDetails"]
test_class = "PackageSearchTest"
tags = ["saas", "feature"]
depends_on = []
needs = []
source = "report 2026-09-30 (unplanned-gap sweep)"
pr = "#2482"
notes = "Read-only and needs no tenant state at all — no device, no organization, nothing to clean up — but it reaches out to Homebrew / Chocolatey / winget, so it is the one case in the suite that fails when the *public* internet is unavailable rather than when the product is broken; say so in the @DisplayName or accept the flake. The contract gives the whole test: PackageSearchItem.id is what packageDetails takes, packageType must be passed back for BREW or you may open the formula's cask twin, packageDetails errors NOT_FOUND on an unknown id (the negative case), versions come newest first, and forward cursor pagination only — pass pageInfo.endCursor back as after. Per-manager gaps are specified and must not be asserted away: publisher is WINGET-only in search results, iconUrl CHOCO-only in search, popularity BREW/CHOCO only, releasedAt Chocolatey only. Homebrew publishes only the current version, so a 'more than one version' assertion has to pick CHOCO. This is also the fixture CP-22/CP-23 need — a bundle's packages must be identified 'exactly as package search returns it' — so doing it first pays twice. Done 2026-09-30 (#2482): PackageSearchTest, 7 cases; Chocolatey is disabled on every environment, so its case pins the refusal; proved by the matrix."

