notes = "UserController.transferOwnership: POST /users/{id}/transfer-ownership, 204, @PreAuthorize(\"hasAuthority('OWNER')\"). UserService.transferOwnership: requester must hold OWNER (else OperationNotAllowedException); transferring to yourself returns without change; target must exist (UserNotFoundException) and be ACTIVE (else OperationNotAllowedException); then target roles := [OWNER], requester roles := [ADMIN], and sendOwnershipTransferEmail (a mail failure does not fail the transfer). Negative cases that change nothing and can land before the decision: transfer to self → 204 and roles unchanged; to a fabricated id → not found; to a user with a pending, not-yet-accepted invitation → refused; called by a non-owner → 403. First check whether the suite's API user is the OWNER (UserTest.testDeleteOwner finds the owner via getUsers(UserRole.OWNER)). Missing: UserApi.transferOwnership. Owner decision 2026-10-01: full round trip (transfer to a throwaway user and back from its session) on pipeline-registered tenants only; the negative cases may run everywhere. Done 2026-10-01 (#2494): UserTest negative cases; the round trip is pipeline-only (PipelineContext.hasRegisteredTenant) and has not run yet; proved by the matrix."

