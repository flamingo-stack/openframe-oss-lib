  "DELETE api/v1/knowledge-base/attachments/{}",
]
test_class = "ExternalKnowledgeBaseTest"
tags = ["external-api"]
depends_on = ["CP-41"]
needs = []
source = "report 2026-09-30 (largest untested external-consumer surface)"
notes = "The second half of the same controller; CP-41 creates the client and the folder fixtures this needs. The lifecycle is the same state machine KnowledgeBaseTest already drives over GraphQL (create → publish → unpublish → archive → unarchive, with archivedArticles as the read-back), and CP-11's attachment case is the template for the presigned round trip: create the attachment, PUT the bytes to the signed URL, fetch the download URL and compare byte for byte, then delete. The 5-requests-per-minute key limit bites hardest here — this half is ten endpoints and a byte-for-byte upload/download, so budget the pacing before writing the case, and archive whatever the class created so the tenant stays reusable."

