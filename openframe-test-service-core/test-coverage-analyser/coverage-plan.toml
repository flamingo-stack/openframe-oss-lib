source = "report 2026-09-30 #10"
notes = "Read the whole controller first — it is small and the matrix is wrong about it. SSOConfigController (openframe-api-service-core/src/main/java/com/openframe/api/controller/SSOConfigController.java, @RequestMapping(\"/sso\")) has seven mappings: GET /providers, GET /providers/available, GET /{provider}, POST /{provider}, PUT /{provider}, PATCH /{provider}/toggle, DELETE /{provider}. The matrix reports PUT and DELETE as covered, and they are not: no file under api/ mentions SSO at all (verified with git grep -i sso over the test library at bafecbfea). The two rows collided by path shape with OrganizationApi's PUT organizations/{id} and the admin teardown's DELETE users/{id}. So this item is really the whole controller, and PUT/DELETE should be added to its ops once the owner confirms the false positive — the run may not edit an existing item's ops, and these two are not in any item's ops today. DTOs are named in the signatures: SSOConfigStatusResponse (list), SSOProviderInfo (available), SSOConfigResponse (get/save/update), SSOConfigRequest (@Valid body — so a malformed body is the 400 negative case). GET /providers/available is the safest first assertion: it lists what this deployment supports and writes nothing. 2026-09-30, after the analyser fix (76c8e11f1): the false positive is confirmed and fixed — PUT and DELETE now read gap-ui — so both are added to ops and the item covers all seven mappings. DELETE is the cleanup for POST. Owner decision 2026-10-01: SSO is out of scope and is never to be automated; dropped, see KG-17."

