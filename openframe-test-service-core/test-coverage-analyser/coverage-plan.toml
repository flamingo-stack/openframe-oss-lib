pr = "#2488"
notes = "device-log.graphqls: deviceLogs(machineId: String @deprecated, machineIds: [String!], filter: DeviceLogFilterInput, first: Int, after: String): DeviceLogConnection!, newest first, always scoped to the current tenant. Omitting machineIds reads every device in the tenant, so the tenant-wide cases need no device; an empty machineIds list is rejected, and at most 50 ids are allowed. DeviceLogFilterInput: levels (DEBUG/INFO/WARN/ERROR), contains/excludes (case-insensitive literal terms, max 5 of 256 characters), from/to (inclusive; from defaults to 7 days before to with a device named, 24 hours without; the range may not exceed 30 days). first is 1-500, default 100; page older entries with after. DeviceLogEntry: timestamp (ingestion, nanosecond precision, the sort key), agentTimestamp, level, message, machineId, hostname, count. Cases: tenant-wide page sorted newest first; levels filter returns only those levels; contains/excludes honoured; first/after pages without overlap; a range over 30 days and an empty machineIds list are refused; one case naming the enrolled box's machineId (tag needs-device on that case only) returns only its lines. The devices UI gates the logs tab behind useDeviceLogsGate, so check the gate before calling the feature live. Done 2026-10-01 (#2488): DeviceLogsTest, 7 cases; the vm115982 case is needs-device; proved by the matrix."

[[items]]
id = "CP-51"
title = "Remote-access policy: device scope"
status = "done"
priority = "P1"
ops = ["mutation:setDeviceRemoteAccessMode"]
test_class = "RemoteAccessPolicyTest"
tags = ["saas", "feature", "needs-device"]
depends_on = ["CP-24"]
needs = []
source = "split from CP-24, 2026-10-01"
pr = "#2491"
notes = "setDeviceRemoteAccessMode(machineId: String!, mode: RemoteAccessMode): Machine! sets a per-device override; refusals (DEVICE_NOT_FOUND, REMOTE_ACCESS_DISABLED) are GraphQL errors with extensions.code, unlike the userErrors of the tenant and organization mutations. The override reads back on Machine.remoteAccess { mode effectiveMode effectiveScope } (an extension on the oss-lib Machine type, so DeviceQueries needs the selection); RemoteAccessPolicyScope is DEVICE|ORGANIZATION|TENANT|DEFAULTS. Use the enrolled box in its real organization (a throwaway organization has no devices): with no override, effectiveScope is ORGANIZATION or TENANT; set an override and assert mode, effectiveMode and effectiveScope DEVICE; clear it with mode null and assert the previous scope returns. Negative: a fabricated machineId raises DEVICE_NOT_FOUND. The override changes how remote sessions to that box behave for everyone, so keep it short, clear it in @AfterAll, and do not run it alongside other remote-access cases. Done 2026-10-01 (#2491): RemoteAccessPolicyTest device cases on vm115982; the override is set to the mode it already resolves to, then cleared; proved by the matrix."
