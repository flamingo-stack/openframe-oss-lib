notes = "KnowledgeBaseController in openframe-external-api-service-core is 20 endpoints, all introduced 2026-09-21, none touched by any test and none under a known-gaps entry — the largest single block of external-consumer surface in the matrix with no safety net. Split in two for one PR each; this half is the tree and the taxonomy, CP-42 is the article lifecycle. The external suite's whole harness already exists (tests/external/, api/external/, ExternalApiBaseTest, the X-API-Key clients) and the GraphQL twins of these operations are the best-covered area in the product — knowledge-base is 24/24 covered by KnowledgeBaseTest — so the assertions can be lifted from there and only the transport changes. Two constraints the external suite already encodes and this must not forget: the qa external API key is limited to 5 requests per minute (which is why the existing external tests carry a pacing layer), and external display names start with 'ExtApi: '. Tag external-api so it lands in that phase, which runs last, after the admin that mints the key still exists. Done 2026-09-30 (#2480): ExternalKnowledgeBaseTest cases 1-14, one ordered case per state; proved by the matrix."

