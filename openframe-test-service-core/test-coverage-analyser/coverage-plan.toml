[[items]]
id = "CP-46"
title = "Transfer tenant ownership"
status = "proposed"
priority = "P3"
ops = ["POST users/{}/transfer-ownership"]
test_class = "UserTest"
tags = ["oss", "feature"]
depends_on = []
needs = ["decision: a successful transfer demotes the current owner to ADMIN and promotes the target to OWNER, and it emails the new owner. On a shared tenant that moves ownership away from the account the pipeline logs in as; the test would have to transfer it back from the new owner's session. Options: negative cases only (below — no state change), or the round trip on a pipeline-registered tenant only"]
source = "analyser fix 2026-09-30 (unplanned UI gaps, settings)"
notes = "UserController.transferOwnership: POST /users/{id}/transfer-ownership, 204, @PreAuthorize(\"hasAuthority('OWNER')\"). UserService.transferOwnership: requester must hold OWNER (else OperationNotAllowedException); transferring to yourself returns without change; target must exist (UserNotFoundException) and be ACTIVE (else OperationNotAllowedException); then target roles := [OWNER], requester roles := [ADMIN], and sendOwnershipTransferEmail (a mail failure does not fail the transfer). Negative cases that change nothing and can land before the decision: transfer to self → 204 and roles unchanged; to a fabricated id → not found; to a user with a pending, not-yet-accepted invitation → refused; called by a non-owner → 403. First check whether the suite's API user is the OWNER (UserTest.testDeleteOwner finds the owner via getUsers(UserRole.OWNER)). Missing: UserApi.transferOwnership."

