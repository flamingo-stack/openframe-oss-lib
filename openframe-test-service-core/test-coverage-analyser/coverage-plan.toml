notes = "Additive and fully reversible, unlike CP-19: a note is created, edited and deleted, and the insight itself is never transitioned — so this is the half that is safe on a shared tenant. deleteInsightNote returns the removed note's ID, not a boolean or a payload. 'Only its author may do this' on update and delete is the negative case, but the suite has one admin session, so it needs a second user (UserInvitationsTest mints one) or it stays unasserted — say which in the PR. insightNotes is a root query taking insightId, deliberately not a field on Insight. insightChatPrompt returns a plain String! containing an `@insight:<id>` marker the assistant expands; assert the marker is present and carries the insight id rather than matching the prose. Owner decision 2026-10-01: follows CP-19: pipeline-registered tenants only."

