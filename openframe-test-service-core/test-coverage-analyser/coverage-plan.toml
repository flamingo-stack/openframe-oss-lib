[[items]]
id = "CP-19"
title = "Insight triage lifecycle"
status = "proposed"
priority = "P1"
ops = [
  "query:insights", "query:insight", "query:insightFilters", "query:insightStatusTransitions",
  "mutation:acknowledgeInsight", "mutation:snoozeInsight", "mutation:resolveInsight",
  "mutation:archiveInsight", "mutation:reopenInsight", "mutation:assignInsight", "mutation:unassignInsight",
]
test_class = "InsightsTest"
tags = ["saas", "feature"]
depends_on = []
needs = [
  "decision: an insight cannot be created by an API call — it is minted by an osquery detector on an enrolled device (Insight.kind is one of 16 fixed detector findings, Insight.id encodes the detector fingerprint). A test can only drive the lifecycle of an insight that already exists, which on a shared tenant is somebody's real finding. Allow (walk one NEW insight to ARCHIVED and reopen it back to NEW, leaving it as found), or restrict the class to pipeline-registered tenants and let it self-skip elsewhere",
  "precondition: the tenant needs at least one insight, so the class needs a needs-insight tag on the lifecycle case the way NotificationsTest carries needs-notification — the `tenant` env block excludes such tags and a fresh pipeline tenant has no insights until a detector has run on its enrolled box",
]
source = "report 2026-09-30 #1"
notes = "The full transition table is readable at runtime from insightStatusTransitions and the mutations enforce exactly it, so the negative cases are derivable rather than guessed: snoozeInsight on an ACKNOWLEDGED insight is refused ('Acknowledged is work in progress and cannot be put back to sleep'), archiveInsight only from RESOLVED, reopenInsight only from ARCHIVED. Side effect to assert and to undo: acknowledge/snooze/resolve all claim an unowned insight for the caller, so the first mutation silently sets assigneeId — capture assigneeId before the walk and restore it with assignInsight/unassignInsight. assignInsight takes a raw User.id (not a Relay global id), unlike Insight.id which is opaque; organizationId/machineId on Insight are the flat Organization.organizationId / Machine.machineId, not the node handles. Mutations return Insight directly with no userErrors wrapper, so refusals are top-level GraphQL errors."

[[items]]
id = "CP-20"
title = "Insight notes and the assistant chat prompt"
status = "proposed"
priority = "P1"
ops = [
  "query:insightNotes", "query:insightChatPrompt",
  "mutation:addInsightNote", "mutation:updateInsightNote", "mutation:deleteInsightNote",
]
test_class = "InsightsTest"
tags = ["saas", "feature"]
depends_on = ["CP-19"]
needs = ["precondition: one existing insight to hang notes off — same needs-insight gate as CP-19, and notes are the non-destructive half so this half can run wherever an insight exists"]
source = "report 2026-09-30 #7"
notes = "Additive and fully reversible, unlike CP-19: a note is created, edited and deleted, and the insight itself is never transitioned — so this is the half that is safe on a shared tenant. deleteInsightNote returns the removed note's ID, not a boolean or a payload. 'Only its author may do this' on update and delete is the negative case, but the suite has one admin session, so it needs a second user (UserInvitationsTest mints one) or it stays unasserted — say which in the PR. insightNotes is a root query taking insightId, deliberately not a field on Insight. insightChatPrompt returns a plain String! containing an `@insight:<id>` marker the assistant expands; assert the marker is present and carries the insight id rather than matching the prose."

