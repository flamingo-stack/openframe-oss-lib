  "POST api/v1/knowledge-base/articles/{}/publish", "POST api/v1/knowledge-base/articles/{}/unpublish",
  "POST api/v1/knowledge-base/articles/{}/archive", "POST api/v1/knowledge-base/articles/{}/unarchive",
  "GET api/v1/knowledge-base/articles/archived",
