notes = "ApiKeyController (openframe-api-service-core, @RequestMapping(\"/api-keys\")): GET list (List<ApiKeyResponse>, scoped to the principal), POST (201, @Valid CreateApiKeyRequest → CreateApiKeyResponse with the secret), GET /{keyId}, PUT /{keyId} (@Valid UpdateApiKeyRequest{name, description, enabled, expiresAt} → ApiKeyResponse), DELETE /{keyId} (204), POST /{keyId}/regenerate (CreateApiKeyResponse — a new secret). ApiKeyApi already has createApiKey/getApiKeys/getApiKey/deleteApiKey(Raw); create, get and delete are reached today only as fixtures of StatsTest and MingoCompactionTest, so the matrix counts them as setup, not direct — this item asserts them directly. Missing: updateApiKey and regenerateApiKey client methods, UpdateApiKeyRequest DTO. One case on a key the test creates and deletes in finally: create → listed → update name/description → GET shows them → regenerate returns a secret different from the original → delete → GET 404. Boundary: disable (enabled=false) and check the list reports it. Shared-tenant safe: touches only its own key. Done 2026-09-30 (#2477): ApiKeysTest, 9 ordered cases; regenerate issues a new key id, not just a new secret; proved by the matrix."

