notes = "UserController.updateUserById: PUT /users/{id}, @Valid UpdateUserRequest{firstName, lastName}, both @Size(max = 128), → UserResponse. Only the name is editable — roles and status are not in the DTO. Edit a user the test owns: invite + accept (UserInvitationsTest already has the fixture flow via InvitationGenerator.acceptInvitationRequest), PUT new names, GET users/{id} (UserApi.getUser, now correctly resolved) shows them. Negative: a 129-character firstName is refused (expect 400 from @Valid; record the actual status). Do not edit the owner or the pipeline admin. Missing: UserApi.updateUser and an UpdateUserRequest DTO. Belongs in UserInvitationsTest because that class creates the throwaway active user; delete it afterwards as testDeleteUser does."

