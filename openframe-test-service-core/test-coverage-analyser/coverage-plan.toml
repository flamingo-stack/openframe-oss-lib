notes = "Split 2026-10-01: the device scope is CP-51, because a throwaway organization has no devices and the device half needs the enrolled box. RemoteAccessPolicyApi, RemoteAccessQueries and RemoteAccessPolicyTest already drive the tenant scope; this adds the organization override on a throwaway organization (the AiSettingsTest pattern), so it stays in the functional phase. setOrganizationRemoteAccessMode(organizationId, mode) returns OrganizationRemoteAccessPolicyPayload with userErrors (ORGANIZATION_NOT_FOUND, REMOTE_ACCESS_DISABLED); mode null clears the override. organizationRemoteAccessPolicy returns mode (the override, or null when inheriting) and effectiveMode: assert inherit (mode null, effectiveMode = tenant mode) → override (both follow) → clear (back to inherit). Negative: a fabricated organization id answers ORGANIZATION_NOT_FOUND in userErrors. Clear the override in @AfterAll. Done 2026-10-01 (#2491): RemoteAccessPolicyTest organization cases on a throwaway organization; proved by the matrix."

[[items]]
id = "CP-25"
title = "Remote-access request and session lifecycle"
status = "done"
priority = "P1"
ops = [
  "mutation:createRemoteAccessRequest", "mutation:revokeRemoteAccessRequest", "query:remoteAccessRequest",
  "mutation:endRemoteSession", "query:remoteSession", "query:activeRemoteSession",
  "query:remoteSessions", "query:remoteAccessRequests",
]
test_class = "RemoteAccessSessionTest"
tags = ["saas", "feature", "needs-device"]
depends_on = ["CP-24"]
needs = []
source = "report 2026-09-30 #5"
pr = "#2498"
notes = "The request half needs no approval and is worth doing even if the decision lands on (c): createRemoteAccessRequest → remoteAccessRequest(requestId) → revokeRemoteAccessRequest is a closed loop, and the schema pins the refusal codes as userErrors on RemoteAccessRequestPayload (DEVICE_HAS_LIVE_REQUEST, DEVICE_HAS_ACTIVE_SESSION, DEVICE_UNREACHABLE, REMOTE_ACCESS_DISABLED, DEVICE_NOT_FOUND, REMOTE_ACCESS_REQUEST_NOT_FOUND, REMOTE_ACCESS_FORBIDDEN, REMOTE_ACCESS_REQUEST_SETTLED). Two cheap negatives fall straight out of that list: a second create on the same device returns the caller's own live request with created:false rather than a new one, and revoke on an already-settled request answers REMOTE_ACCESS_REQUEST_SETTLED with the settled request attached. Set the device to DENY_ACCESS through CP-24 to get REMOTE_ACCESS_DISABLED deterministically. deviceId is the OpenFrame machine id (the ?id= value on the device pages), not a global id. requestId/sessionId are plain 26-char ULIDs, not Relay ids. The read-side ops remoteSessions/remoteAccessRequests are per-device audit connections, clamped first 1..100 default 20, and are legitimately empty on a device nothing has connected to — assert the connection shape and totalCount, not a row. activeRemoteSession returns null for another technician's session on purpose, so an empty answer is never proof of absence. Ordered before the `device` phase would collide with DeviceRemoteTest, which opens real sessions on the same box — keep this in functional and pick a request the class revokes itself. Owner decision 2026-10-01: route (b): approve over the machine-side REST endpoint with vm115982's agent identity, as the Fae suite does; that also covers the open gap-api row for the approve endpoint. Done 2026-10-01 (#2498): RemoteAccessSessionTest, 14 cases; 2 skip while vm115982 resolves to SILENT_ACCESS (no pending request to approve); proved by the matrix."

[[items]]
id = "CP-26"
title = "Directory connection lifecycle (no IdP account needed)"
status = "proposed"
priority = "P1"
ops = [
  "query:directoryConnections", "query:directoryConnection", "query:directoryConnectionOptions",
  "query:directoryConnectionOrganizations", "mutation:createDirectoryConnection",
  "mutation:updateDirectoryConnection", "mutation:startDirectoryConsent",
  "mutation:checkDirectoryConnection", "mutation:deleteDirectoryConnection",
]
test_class = "DirectoryConnectionsTest"
tags = ["saas", "feature"]
depends_on = []
needs = ["deferred by the owner on 2026-10-01"]
source = "report 2026-09-30 #3"
notes = "The reason this is reachable without a Google/Microsoft account, and the fact an implementer must not miss: createDirectoryConnection persists the connection in DISCONNECTED state before any consent, and checkDirectoryConnection is explicit that 'an unreachable provider is an answer, not an error' — the mutation succeeds and access.state carries the verdict. So the whole CRUD ring is assertable with no IdP: create (assert DISCONNECTED, directoryId/grantedBy/connectedAt all null), read it back by id and find it in the paged list by search, rename and move it to another customer, re-mint the consent link, probe it and read access { state reason checkedAt capabilities }, delete it and confirm it is gone. Two specified oddities are the negative cases: consentUrl may legitimately be null right after create when the provider was unreachable at that moment (the connection is still real — startDirectoryConsent retries the link), and the domain edit is accepted only while connectedAt is null, answering a userError otherwise. Which providers are even offerable is deployment-gated — read directoryConnectionOptions.providers first and self-skip when it is empty rather than hardcoding GOOGLE_WORKSPACE. directoryConnectionOrganizations lists only active customers not already linked to any connection of any provider, so the customer created for the test must come from that list or the create will not be reproducible; name is unique per tenant+provider, so namespace it with RunId. Pager contract worth pinning: totalCount comes from the search index and can exceed the edges actually returned, so page until pageInfo.hasNextPage is false — the schema says so twice. Owner decision 2026-10-01: deferred; not to be built for now."

[[items]]
id = "CP-27"
title = "Software inventory and vulnerability reads (fleet-wide)"
status = "done"
priority = "P2"
ops = [
  "query:softwares", "query:software", "query:softwareFilters",
  "query:softwareDevices", "query:softwareDeviceFilters", "query:softwareVulnerabilities",
  "query:vulnerabilities", "query:vulnerability", "query:vulnerabilityFilters", "query:vulnerabilityDevices",
]
test_class = "SoftwareInventoryTest"
tags = ["saas", "feature"]
depends_on = []
needs = []
source = "report 2026-09-30 #8"
pr = "#2500"
notes = "Read-only, so the risk is entirely 'does the data exist', not 'what does it break'. Verified enabled on qa: openframe.rmm.software.enabled true (configs/qa/openframe-saas-api.yml:29) — the resolvers are @Conditional on it, so on a deployment where it is off these fields are absent from the schema, not empty. Follow LogsTest, which already asserts a connection against its own facets. Boundary case the schema hands you for free: 'an unknown sort field is rejected as a client error (BAD_REQUEST), not a server error' on softwares, and the sortable set is exactly name/devicesCount/cveCount/highestSeverity. vulnerability(cveId) is the one op with a recent fix behind it — 03944fa32 2026-09-25 'Fixed: VulnerabilityByCVE does not provide Softwares and Devices' — so the assertion that earns its keep is that a CVE taken from the vulnerabilities list resolves affectedSoftware and that vulnerabilityDevices(cveId) is non-empty for it; those are the two fields that regressed. Detail-only fields (description, resolvedInVersion, affectedSoftware) are null on list rows by design, so read them from the by-id query and not from the connection. software(id) and softwares take Relay global ids; vulnerability/vulnerabilityDevices key on the plain CVE string. Owner decision 2026-10-01: Fleet MDM is fixed and connects again, so the cases assert real rows; configs/base/openframe-saas-test.yml still pins require-fleet-connection to false and may be flipped back. Done 2026-10-01 (#2500): SoftwareInventoryTest; case 5 stays red on purpose: a Mac mapped to two Fleet hosts is listed and counted twice; proved by the matrix."

