notes = "Done 2026-09-13 (coverage): TimeTrackingTest, 5 cases on qa test-env in ~18 s, 4 green; 'Manual entry rejects a non-positive duration' fails by design until the product is fixed: createTimeEntry with durationSeconds 0 answers HTTP 502 (Bean Validation @Positive on the api-service DTO fires before the data fetcher and is not mapped to a GraphQL error), while the service-layer rule 'Duration must be positive' never runs. Report to the api-service owner. Also covers timeEntry. Findings not in the schema: every id in inputs and filters is a Relay global id (helpers/RelayIds, unpadded Base64 of Typename:rawId) while TimeEntry.userId/user.id are raw; a stopped or manual entry must carry a ticket or notes; a second timer, a pause with none, and editing a running timer are refused as conflicts; deleteTimeEntry is false the second time. The class cancels any leftover timer first and deletes what it created. unlinkTicketFromTimeEntry still open (needs a ticket)."

