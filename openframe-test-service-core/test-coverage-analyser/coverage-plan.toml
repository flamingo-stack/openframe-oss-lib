# Coverage plan — the backlog of test work that closes gaps in the API coverage matrix.
#
# coverage_matrix.py scores every item on each run (see the "Plan" section of coverage.md):
# an item is proved `done` only when every op it lists is reached by a direct, enabled test.
# Effort is computed from the fixtures still missing; you do not estimate it here.
#
# Fields
#   id          stable, CP-<n>; referenced from commits, PRs and the report
#   title       one line
#   status      proposed | planned | in-progress | done | dropped   (human-owned; the analyser never changes it)
#   priority    P1 | P2 | P3
#   ops         matrix keys this item closes: "query:<field>", "mutation:<field>", "<METHOD> <service path>"
#   test_class  target class under tests/ (existing or new); used for the effort model
#   tags        JUnit tags the new cases carry; phase follows from them (see prompt.md Step 4)
#   depends_on  other CP ids that must be done first (fixtures they create)
#   needs       preconditions or decisions the item waits on (free text)
#   source      where the item came from (report date and proposal number)
#   owner / branch / pr / clickup / notes   optional bookkeeping
#
# The headless run may append new items with status = "proposed" and may add to `notes` and `needs`;
# it never edits status, priority or ops of an existing item. Promote `proposed` → `planned` by hand.

[[items]]
id = "CP-1"
title = "Script-schedule lifecycle"
status = "proposed"
priority = "P1"
ops = [
  "mutation:createScriptSchedule", "mutation:updateScriptSchedule", "mutation:archiveScriptSchedule",
  "mutation:unarchiveScriptSchedule", "query:scriptSchedule", "query:scriptSchedules", "query:scriptScheduleFilters",
]
test_class = "ScriptScheduleTest"
tags = ["saas", "feature"]
depends_on = []
needs = ["decision: may script dispatch reach the enrolled box outside the device phase (use a far-future startAt otherwise)"]
source = "report 2026-09-12 #1"
notes = "Do not reuse data/dto/script/ScriptSchedule*.java or ScriptGenerator.createOnlineCheckSchedule(): Tactical-RMM shaped. startAt must sit on a 30-minute boundary; repeat in 1800 s multiples; update has PUT semantics."

