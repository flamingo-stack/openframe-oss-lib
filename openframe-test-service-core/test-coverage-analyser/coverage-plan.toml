[[items]]
id = "CP-49"
title = "Frontend feature flags and dashboard activity events"
status = "proposed"
priority = "P3"
ops = ["query:feFeatureFlags", "POST events"]
test_class = "FrontendSupportTest"
tags = ["saas", "feature"]
depends_on = []
needs = ["decision for POST events only: a valid publish puts a real DASHBOARD_ACTIVITY event for the test user on the user-events outbound Kafka topic; find its consumer (onboarding progress, CP-31, is the likely one) before asserting more than 202. The validation cases below publish nothing and need no decision"]
source = "analyser fix 2026-09-30 (unplanned UI gaps, UI plumbing)"
notes = "Two small calls the UI shell makes on every session. feFeatureFlags(names: [String!]): [FeFeatureFlag!]! (module openframe-fe-feature-flags) — 'unknown flags default to false': request one fabricated name and assert it comes back with enabled false, plus one real flag name read from the frontend's hooks. POST /events is TenantEventController in openframe-saas-api (202 ACCEPTED, TenantEventRequest{eventType, subtype, repeatMode}). TenantEventService allows only eventType DASHBOARD_ACTIVITY, requires a non-blank subtype and a repeatMode; each violation is IllegalArgumentException → 400, thrown before anything is published — three safe negative cases. Idempotency key is userId:subtype (ONCE) or with a timestamp (MULTI). Missing: a Queries constant, client methods, and a TenantEventRequest DTO. Split into two classes if the owner prefers; they share no fixture."
