notes = "Two small calls the UI shell makes on every session. feFeatureFlags(names: [String!]): [FeFeatureFlag!]! (module openframe-fe-feature-flags) — 'unknown flags default to false': request one fabricated name and assert it comes back with enabled false, plus one real flag name read from the frontend's hooks. POST /events is TenantEventController in openframe-saas-api (202 ACCEPTED, TenantEventRequest{eventType, subtype, repeatMode}). TenantEventService allows only eventType DASHBOARD_ACTIVITY, requires a non-blank subtype and a repeatMode; each violation is IllegalArgumentException → 400, thrown before anything is published — three safe negative cases. Idempotency key is userId:subtype (ONCE) or with a timestamp (MULTI). Missing: a Queries constant, client methods, and a TenantEventRequest DTO. Split into two classes if the owner prefers; they share no fixture. Owner decision 2026-10-01: allowed, including one real DASHBOARD_ACTIVITY publish for the test user. Done 2026-10-01 (#2492): FrontendSupportTest, 7 cases, one real DASHBOARD_ACTIVITY publish; proved by the matrix."

