[[items]]
id = "CP-19"
title = "Insight triage lifecycle"
status = "proposed"
priority = "P1"
ops = [
  "query:insights", "query:insight", "query:insightFilters", "query:insightStatusTransitions",
  "mutation:acknowledgeInsight", "mutation:snoozeInsight", "mutation:resolveInsight",
  "mutation:archiveInsight", "mutation:reopenInsight", "mutation:assignInsight", "mutation:unassignInsight",
]
test_class = "InsightsTest"
tags = ["saas", "feature"]
depends_on = []
needs = ["precondition: openframe-saas-shared #2368 merged — it excludes the needs-registered-tenant tag from the tenant block and the feature phase"]
source = "report 2026-09-30 #1"
notes = "The full transition table is readable at runtime from insightStatusTransitions and the mutations enforce exactly it, so the negative cases are derivable rather than guessed: snoozeInsight on an ACKNOWLEDGED insight is refused ('Acknowledged is work in progress and cannot be put back to sleep'), archiveInsight only from RESOLVED, reopenInsight only from ARCHIVED. Side effect to assert and to undo: acknowledge/snooze/resolve all claim an unowned insight for the caller, so the first mutation silently sets assigneeId — capture assigneeId before the walk and restore it with assignInsight/unassignInsight. assignInsight takes a raw User.id (not a Relay global id), unlike Insight.id which is opaque; organizationId/machineId on Insight are the flat Organization.organizationId / Machine.machineId, not the node handles. Mutations return Insight directly with no userErrors wrapper, so refusals are top-level GraphQL errors. Owner decision 2026-10-01: pipeline-registered tenants only (a detector must have run on the run's own box); the class self-skips on test-env. Needs a needs-insight style tag that the tenant env block in openframe-saas-test.yml excludes. Implementation: tag the insight classes @Tag(\"needs-registered-tenant\") and @Tag(\"post-mingo\") (detectors on the enrolled box need the run to have reached that phase), and guard each case with assumeTrue(PipelineContext.hasRegisteredTenant()); the same tag is on the CP-39 save and CP-46 round trip (oss-lib tag PR)."

