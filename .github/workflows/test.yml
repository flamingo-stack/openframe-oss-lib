name: OpenFrame OSS Libs Test

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, closed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: "com.openframe.oss"
  ARTIFACT_REGISTRY: "com/openframe/oss"
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.event.repository.name }}

# =============================================================================
# JOBS
# =============================================================================

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml
    if: github.event.pull_request.state == 'open' && !github.event.pull_request.draft

  matrix:
    name: Matrix
    needs: [changes]
    uses: ./.github/workflows/matrix.yml


  test-java:
    name: Test Java
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.java == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Resolve PR Snapshot Version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          URL="https://maven.pkg.github.com/${{ github.repository }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.REPOSITORY }}/maven-metadata.xml"
          OLD_VERSION=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" "$URL" |
                        grep -oP '<version>\K[0-9]+\.[0-9]+\.[0-9]+(?=</version>)' | sort -V | tail -1)
          echo "NEW_VERSION=${OLD_VERSION%.*}.$((${OLD_VERSION##*.} + 1))-${{ github.event.pull_request.number }}-SNAPSHOT" >> $GITHUB_ENV

      - name: Build and Publish ${{ env.NEW_VERSION }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mvn clean deploy \
            -Drevision="${{ env.NEW_VERSION }}" \
            -s .mvn/settings.xml \
            --batch-mode \
            --no-transfer-progress \
            -Dmaven.javadoc.skip=true


  test-node:
    name: Test Node (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [changes, matrix]
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.node_matrix) }}

    steps:
      - name: Check if should run
        id: should_run
        run: echo "run=${{ fromJSON(toJSON(needs.changes.outputs))[matrix.name] == 'true' }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.should_run.outputs.run == 'true'

      - name: Setup Node.js
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: npm install

      - name: Type Check
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: npm run type-check
        continue-on-error: true

      - name: Test
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: npm run test:run

      - name: Build
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: npm run build

      - name: Upload Build Artifacts
        if: steps.should_run.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: ${{ matrix.path }}/dist/
          retention-days: 1
          if-no-files-found: error
  

  test-rust:
    name: "Test Rust (${{ matrix.os }})"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      OPENFRAME_VERSION: 0.0.0-dev
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Rust tools
        uses: ./.github/steps/rust-setup
        with:
          path: clients/openframe-client
          components: clippy,rustfmt
          shared-key: openframe-client-${{ matrix.os }}

      - name: Lint (cargo fmt --check + cargo clippy -D warnings)
        run: make -C clients/openframe-client lint

      - name: Build client binary
        run: make -C clients/openframe-client build-bin

      - name: Test
        run: make -C clients/openframe-client test


  cleanup:
    name: Cleanup
    if: github.event.pull_request.state != 'open'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete PR ${{ github.event.pull_request.number }} snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          SUFFIX: -${{ github.event.pull_request.number }}-SNAPSHOT
        run: |
          gh api "/orgs/${{ env.ORGANISATION }}/packages?package_type=maven" --paginate \
            --jq '.[] | select(.name | startswith("${{ env.REGISTRY }}.")) | .name' |
          while read -r PKG; do
            gh api "/orgs/${{ env.ORGANISATION }}/packages/maven/$PKG/versions" --paginate \
              --jq "[.[] | select(.name | endswith(\"$SUFFIX\"))] | .[].id" |
              xargs -r -n1 -I{} gh api --silent -X DELETE "/orgs/${{ env.ORGANISATION }}/packages/maven/$PKG/versions/{}"
          done


  all-checks:
    name: "All Checks"
    needs: [changes, matrix, test-java, test-node, test-rust]
    runs-on: ubuntu-latest
    if: |
      always() && 
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || !contains(needs.*.result, 'skipped'))
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All checks passed"
