name: OpenFrame OSS Libs Test

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, closed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: "com.openframe.oss"
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: "com/openframe/oss/${{ github.event.repository.name }}"

# =============================================================================
# JOBS
# =============================================================================

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yaml
    if: github.event.pull_request.state == 'open' && !github.event.pull_request.draft


  scan:
    name: "Scan Code: ${{ matrix.target.name }}"
    runs-on: ubuntu-latest
    needs: [changes]
    permissions:
      contents: read
      packages: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.changes.outputs.node_matrix) }}
        include:
          - target: { name: backend, path: ".", paths: "**/{pom.xml,Cargo.toml,Cargo.lock,Dockerfile*}", skip_files: "**/package.json,**/package-lock.json,**/yarn.lock,**/pnpm-lock.yaml" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Scan code
        uses: ./.github/steps/trivy
        with:
          scan: code
          path: ${{ matrix.target.path }}
          paths: ${{ matrix.target.paths || '' }}
          skip-files: ${{ matrix.target.skip_files || '' }}
          image-name: ${{ matrix.target.name }}

  test-java:
    name: Test Java
    runs-on: ubuntu-latest
    needs: [changes]
    if: fromJSON(needs.changes.outputs.changes || '{}').java == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Resolve PR Snapshot Version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          URL="https://maven.pkg.github.com/${{ github.repository }}/${{ env.REPOSITORY }}/maven-metadata.xml"
          OLD_VERSION=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" "$URL" |
                        grep -oP '<version>\K[0-9]+\.[0-9]+\.[0-9]+(?=</version>)' | sort -V | tail -1)
          echo "NEW_VERSION=${OLD_VERSION%.*}.$((${OLD_VERSION##*.} + 1))-${{ github.event.pull_request.number }}-SNAPSHOT" >> $GITHUB_ENV

      - name: Build and Publish ${{ env.NEW_VERSION }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mvn clean deploy \
            -Drevision="${{ env.NEW_VERSION }}" \
            -s .mvn/settings.xml \
            --threads 2C \
            --batch-mode \
            --no-transfer-progress \
            -Dmaven.source.skip=true


  test-node:
    name: Test Node (openframe-frontend-core)
    runs-on: ubuntu-latest
    needs: [changes]
    if: fromJSON(needs.changes.outputs.changes || '{}')['openframe-frontend-core'] == 'true'
    # npm's defaults allow 970s of silence per hung registry socket; these bound it to 115s
    env:
      NPM_CONFIG_FETCH_TIMEOUT: 30000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 15000
      NPM_CONFIG_LOGLEVEL: http
    defaults:
      run:
        shell: bash
        working-directory: openframe-frontend-core
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No lockfile is committed (.gitignore), so the cache keys on package.json.
          cache: npm
          cache-dependency-path: openframe-frontend-core/package.json

      # Bundled npm intermittently throws "Cannot read properties of null (reading 'edgesOut')" without a lockfile.
      - name: Upgrade npm
        run: npm install -g npm@11.9.0

      # `install`, not `ci`: `ci` needs a lockfile.
      - name: Install Dependencies
        run: npm install

      # ~1s; a broken eslint config makes every lint result below meaningless.
      - name: Lint Config Smoke
        run: npm run lint:config-smoke

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Needs a TypeScript program and an 8 GB heap; the slowest check, so kept apart.
      - name: Lint (type-aware)
        run: npm run lint:types

      - name: Format
        run: npm run format

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # No local (file:/link:/.yalc) specs may reach the registry - see the script.
      - name: Check publish manifest
        run: node scripts/check-publish-manifest.mjs package.json

      # --ignore-scripts skips a prepack rebuild.
      - name: Pack
        run: |
          OLD_VERSION=$(npm view "$(jq -r .name package.json)" dist-tags.latest)
          npm version "${OLD_VERSION%.*}.$((${OLD_VERSION##*.} + 1))-${{ github.event.pull_request.number }}.${{ github.run_number }}.${{ github.run_attempt }}" --no-git-tag-version
          echo "PACKAGE_TARBALL=$PWD/$(npm pack --ignore-scripts --json | jq -r '.[0].filename')" >> "$GITHUB_ENV"

      # PR builds go to pkg.pr.new only.
      - name: Preview registry (pkg.pr.new)
        run: |
          npm exec --no -- pkg-pr-new publish --no-compact --no-template --comment=off --json pkg-pr-new.json "$PACKAGE_TARBALL"
          jq -r '.packages[0].url' pkg-pr-new.json >> "$GITHUB_STEP_SUMMARY"


  # Own job for wall clock: graph-wide and slower than all of test-node; sequential made PR checks ~16 min.
  # Keep it in all-checks; it once reported zero for months with a real cycle in the tree.
  test-node-cycles:
    name: Test Node Cycles (openframe-frontend-core)
    runs-on: ubuntu-latest
    needs: [changes]
    if: fromJSON(needs.changes.outputs.changes || '{}')['openframe-frontend-core'] == 'true'
    env:
      NPM_CONFIG_FETCH_TIMEOUT: 30000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 15000
      NPM_CONFIG_LOGLEVEL: http
    defaults:
      run:
        working-directory: openframe-frontend-core
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: openframe-frontend-core/package.json

      # Same bundled-npm bug as in test-node.
      - name: Upgrade npm
        run: npm install -g npm@11.9.0

      - name: Install Dependencies
        run: npm install

      - name: Lint (import cycles)
        run: npm run lint:cycles


  test-rust:
    name: "Test Rust (${{ matrix.os }})"
    needs: changes
    if: fromJSON(needs.changes.outputs.changes || '{}').rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      OPENFRAME_VERSION: 0.0.0-dev
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Rust tools
        uses: ./.github/steps/rust-setup
        with:
          path: clients/openframe-client
          components: clippy,rustfmt
          shared-key: openframe-client-${{ matrix.os }}

      - name: Lint (cargo fmt --check + cargo clippy -D warnings)
        run: make -C clients/openframe-client lint

      - name: Build client binary
        run: make -C clients/openframe-client build-bin

      - name: Test
        run: make -C clients/openframe-client test


  cleanup:
    name: Cleanup
    if: github.event.pull_request.state != 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Delete PR ${{ github.event.pull_request.number }} java snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          SUFFIX: -${{ github.event.pull_request.number }}-SNAPSHOT
        run: |
          gh api "/orgs/${{ env.ORGANISATION }}/packages?package_type=maven" --paginate \
            --jq '.[] | select(.name | startswith("${{ env.REGISTRY }}.")) | .name' |
          while read -r PKG; do
            gh api "/orgs/${{ env.ORGANISATION }}/packages/maven/$PKG/versions" --paginate \
              --jq "[.[] | select(.name | endswith(\"$SUFFIX\"))] | .[].id" |
              xargs -r -I{} gh api --silent -X DELETE "/orgs/${{ env.ORGANISATION }}/packages/maven/$PKG/versions/{}"
          done

  all-checks:
    name: "All Checks"
    needs: [changes, test-java, test-node, test-node-cycles, test-rust]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || !contains(needs.*.result, 'skipped'))
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All checks passed"
