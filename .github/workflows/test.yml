name: OpenFrame OSS Libs Test

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, closed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: "com.openframe.oss"
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: "com/openframe/oss/${{ github.event.repository.name }}"

# =============================================================================
# JOBS
# =============================================================================

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml
    if: github.event.pull_request.state == 'open' && !github.event.pull_request.draft

  matrix:
    name: Matrix
    needs: [changes]
    uses: ./.github/workflows/matrix.yml


  trivy_code:
    name: "Trivy Code Scan"
    runs-on: ubuntu-latest
    needs: [changes]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Trivy scan (dependencies + Dockerfile base images)
        uses: ./.github/steps/trivy
        with:
          scan: code

  test-java:
    name: Test Java
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.java == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Resolve PR Snapshot Version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          URL="https://maven.pkg.github.com/${{ github.repository }}/${{ env.REPOSITORY }}/maven-metadata.xml"
          OLD_VERSION=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" "$URL" |
                        grep -oP '<version>\K[0-9]+\.[0-9]+\.[0-9]+(?=</version>)' | sort -V | tail -1)
          echo "NEW_VERSION=${OLD_VERSION%.*}.$((${OLD_VERSION##*.} + 1))-${{ github.event.pull_request.number }}-SNAPSHOT" >> $GITHUB_ENV

      - name: Build and Publish ${{ env.NEW_VERSION }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mvn clean deploy \
            -Drevision="${{ env.NEW_VERSION }}" \
            -s .mvn/settings.xml \
            --threads 2C \
            --batch-mode \
            --no-transfer-progress \
            -Dmaven.source.skip=true


  test-node:
    name: Test Node (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [changes, matrix]
    # npm's defaults allow 970s of silence per hung registry socket; these bound it to 115s 
    env:
      NPM_CONFIG_FETCH_TIMEOUT: 30000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 15000
      NPM_CONFIG_LOGLEVEL: http
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.node_matrix) }}

    steps:
      - name: Check if should run
        id: should_run
        run: echo "run=${{ fromJSON(toJSON(needs.changes.outputs))[matrix.name] == 'true' }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.should_run.outputs.run == 'true'

      - name: Setup Node.js
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: npm install

      - name: Type Check
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: npm run type-check
        continue-on-error: true

      - name: Test
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: npm run test:run

      - name: Build
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: npm run build

      - name: Resolve PR Version
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: |
          OLD_VERSION=$(npm view "$(jq -r .name package.json)" dist-tags.latest)
          echo "NEW_VERSION=${OLD_VERSION%.*}.$((${OLD_VERSION##*.} + 1))-${{ github.event.pull_request.number }}.${{ github.run_number }}.${{ github.run_attempt }}" >> $GITHUB_ENV

      - name: Publish ${{ env.NEW_VERSION }} (pr-${{ github.event.pull_request.number }} tag)
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm version "${{ env.NEW_VERSION }}" --no-git-tag-version
          npm publish --tag "pr-${{ github.event.pull_request.number }}" --ignore-scripts


  test-rust:
    name: "Test Rust (${{ matrix.os }})"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      OPENFRAME_VERSION: 0.0.0-dev
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Rust tools
        uses: ./.github/steps/rust-setup
        with:
          path: clients/openframe-client
          components: clippy,rustfmt
          shared-key: openframe-client-${{ matrix.os }}

      - name: Lint (cargo fmt --check + cargo clippy -D warnings)
        run: make -C clients/openframe-client lint

      - name: Build client binary
        run: make -C clients/openframe-client build-bin

      - name: Test
        run: make -C clients/openframe-client test


  cleanup:
    name: Cleanup
    if: github.event.pull_request.state != 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Delete PR ${{ github.event.pull_request.number }} java snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          SUFFIX: -${{ github.event.pull_request.number }}-SNAPSHOT
        run: |
          gh api "/orgs/${{ env.ORGANISATION }}/packages?package_type=maven" --paginate \
            --jq '.[] | select(.name | startswith("${{ env.REGISTRY }}.")) | .name' |
          while read -r PKG; do
            gh api "/orgs/${{ env.ORGANISATION }}/packages/maven/$PKG/versions" --paginate \
              --jq "[.[] | select(.name | endswith(\"$SUFFIX\"))] | .[].id" |
              xargs -r -I{} gh api --silent -X DELETE "/orgs/${{ env.ORGANISATION }}/packages/maven/$PKG/versions/{}"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Delete PR ${{ github.event.pull_request.number }} npm versions
        working-directory: openframe-frontend-core
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG=$(jq -r .name package.json)
          npm dist-tag rm "$PKG" "pr-${{ github.event.pull_request.number }}" || true
          npm view "$PKG" versions | grep -oE "[0-9.]+-${{ github.event.pull_request.number }}\.[0-9.]+" |
            xargs -r -I{} npm unpublish "$PKG@{}"


  all-checks:
    name: "All Checks"
    needs: [changes, matrix, test-java, test-node, test-rust]
    runs-on: ubuntu-latest
    if: |
      always() && 
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || !contains(needs.*.result, 'skipped'))
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All checks passed"
