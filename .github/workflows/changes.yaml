name: Detect Changes

on:
  workflow_call:
    outputs:
      changes:
        description: "JSON object mapping each component key to true/false"
        value: ${{ jobs.collect.outputs.changes }}

jobs:
  collect:
    name: Changes and Matrix
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Define components
        id: define
        run: |
          set -euo pipefail

          filters=$(jq -nc '{
              "java": [
                "pom.xml",
                "openframe-agent-key/**",
                "openframe-api-lib/**",
                "openframe-api-service-core/**",
                "openframe-authorization-service-core/**",
                "openframe-client-core/**",
                "openframe-config-core/**",
                "openframe-core/**",
                "openframe-core-crypto/**",
                "openframe-data-cassandra/**",
                "openframe-data-device-aspect/**",
                "openframe-data-kafka/**",
                "openframe-data-mongo-common/**",
                "openframe-data-mongo-sync/**",
                "openframe-data-mongo-reactive/**",
                "openframe-data-nats/**",
                "openframe-data-pinot/**",
                "openframe-data-redis/**",
                "openframe-data-timeentry-aspect/**",
                "openframe-debezium-initializer/**",
                "openframe-exception/**",
                "openframe-external-api-service-core/**",
                "openframe-fe-feature-flags/**",
                "openframe-gateway-service-core/**",
                "openframe-graphql-node/**",
                "openframe-graphql-relay/**",
                "openframe-idp-configuration/**",
                "openframe-management-service-core/**",
                "openframe-notification-core/**",
                "openframe-notification-mail/**",
                "openframe-notification-push/**",
                "openframe-pinot-initializer/**",
                "openframe-security-core/**",
                "openframe-security-oauth/**",
                "openframe-stream-service-core/**",
                "openframe-test-service-core/**",
                "openframe-tool-agent-nats-installation/**",
                "sdk/**",
                ".mvn/**"
              ],
              "openframe-frontend-core": [
                "openframe-frontend-core/**"
              ],
              "rust": [
                "clients/**",
                ".github/steps/rust-setup/**"
              ],
              "cargo": [
                "clients/**/Cargo.lock"
              ],
              "trivy": [
                ".trivyignore",
                "trivy.yaml",
                ".github/steps/trivy/**"
              ]
            }')

          keys=$(jq -nc --argjson f "$filters" '$f | keys')

          [ "$(jq 'length' <<< "$keys")" -gt 0 ] || { echo "no change filters" >&2; exit 1; }

          {
            echo "filters=$filters"
            echo "keys=$keys"
          } >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: ${{ steps.define.outputs.filters }}

      - name: Build changes map
        id: changes
        env:
          CHANGED: ${{ steps.filter.outputs.changes || '[]' }}
          KEYS: ${{ steps.define.outputs.keys }}
        run: |
          set -euo pipefail
          changes=$(jq -nc --argjson changed "$CHANGED" --argjson keys "$KEYS" '
            reduce $keys[] as $k ({}; .[$k] = ((($changed | index($k)) != null) | tostring))
          ')
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
