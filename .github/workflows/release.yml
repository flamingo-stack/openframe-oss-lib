name: OpenFrame OSS Libs Release

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'What to release'
        required: true
        type: choice
        options:
          - java
          - node
          - rust
      version:
        description: 'Version to release OSS Libs (x.y.z). Leave empty for auto patch bump.'
        required: false
        type: string
        default: ''
      snapshot:
        description: 'Publish a SNAPSHOT from the selected ref instead of a release (no version tag). Use this to test an unmerged branch live.'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: "com.openframe.oss"
  ARTIFACT_REGISTRY: "com/openframe/oss"
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.event.repository.name }}

# =============================================================================
# JOBS
# =============================================================================

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yaml
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'push'


  release-java:
    name: Release Java
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'java') ||
      (github.event_name == 'push' && fromJSON(needs.changes.outputs.changes || '{}').java == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get Previous Version
        env:
          MAVEN_REGISTRY: maven.pkg.github.com
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          URL="https://$MAVEN_REGISTRY/${{ env.ORGANISATION }}/${{ env.REPOSITORY }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.REPOSITORY }}/maven-metadata.xml"
          OLD_VERSION=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" "$URL" | \
                        grep -oP '<version>\K[^<]+' | \
                        grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          OLD_VERSION=${OLD_VERSION:-0.0.0}
          echo "OLD_VERSION=$OLD_VERSION" >> $GITHUB_ENV
          echo "Found old version: $OLD_VERSION"

      - name: Set Snapshot Version
        if: github.event_name == 'push' || inputs.snapshot
        run: |
          NEW_VERSION="${OLD_VERSION%.*}.$((${OLD_VERSION##*.} + 1))-SNAPSHOT"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "$OLD_VERSION → $NEW_VERSION"

      - name: Set Release Version
        if: github.event_name == 'workflow_dispatch' && !inputs.snapshot
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          IFS='.' read -r major minor patch <<< "$OLD_VERSION"
          NEW_VERSION=${NEW_VERSION:-$major.$minor.$((patch + 1))}
          case "$NEW_VERSION" in
            "$major.$minor.$((patch + 1))"|"$major.$((minor + 1)).0"|"$((major + 1)).0.0") echo "$OLD_VERSION → $NEW_VERSION" ;;
            *) echo "Invalid version bump: $OLD_VERSION → $NEW_VERSION"; exit 1 ;;
          esac
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Build and Deploy ${{ env.NEW_VERSION }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mvn clean deploy \
            -Drevision="${{ env.NEW_VERSION }}" \
            -s .mvn/settings.xml \
            --threads 2C \
            --batch-mode \
            --no-transfer-progress

      - name: Clean SNAPSHOT versions
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (echo "${{ env.REPOSITORY }}"; grep -oP '(?<=<module>)[^<]+' pom.xml) | while read MODULE; do
            ARTIFACT="${MODULE##*/}"  # Remove directory prefix
            PKG="${{ env.REGISTRY }}.${ARTIFACT//\./%2E}"
            echo "Cleaning $PKG..."
            gh api "/orgs/${{ env.ORGANISATION }}/packages/maven/$PKG/versions" --paginate \
              --jq '[.[] | select(.name | test("SNAPSHOT")) | select(.name | test("-[0-9]+-SNAPSHOT") | not)] | sort_by(.created_at) | reverse | .[3:] | .[].id' |
              xargs -r -n1 -I{} gh api -X DELETE "/orgs/${{ env.ORGANISATION }}/packages/maven/$PKG/versions/{}"
          done


  release-node:
    name: Release Node (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [changes]
    permissions:
      # A release pushes its version tag and starts this workflow on it.
      contents: write
      actions: write
      packages: write
    # npm's defaults allow 970s of silence per hung registry socket; these bound it to 115s 
    env:
      NPM_CONFIG_FETCH_TIMEOUT: 30000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 15000
      NPM_CONFIG_LOGLEVEL: http
    strategy:
      matrix:
        include: ${{ fromJson(needs.changes.outputs.node_matrix) }}

    steps:
      - name: Check if should run
        id: should_run
        run: echo "run=${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'node') || (github.event_name == 'push' && fromJSON(needs.changes.outputs.changes || '{}')[matrix.name] == 'true') }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.should_run.outputs.run == 'true'

      - name: Setup Node.js
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Works around an Arborist bug in the npm version `actions/setup-node`'s
      # Node 22 image currently bundles — see test.yml's test-node job for the
      # full explanation. Pin removed once the bundled npm on that image picks
      # up the fix upstream.
      - name: Upgrade npm (workaround for a bundled-npm Arborist bug)
        if: steps.should_run.outputs.run == 'true'
        run: npm install -g npm@11.9.0

      - name: Install Dependencies
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: npm install

      - name: Build
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: npm run build

      - name: Get Previous Version
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        run: |
          # The release history is this repository's version tags: every release is tagged <x.y.z>.
          OLD_VERSION=$(git ls-remote --tags --refs origin | cut -d/ -f3 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          OLD_VERSION=${OLD_VERSION:-0.0.0}
          echo "OLD_VERSION=$OLD_VERSION" >> $GITHUB_ENV
          echo "Found old version: $OLD_VERSION"

      - name: Set Snapshot Version
        if: steps.should_run.outputs.run == 'true' && (github.event_name == 'push' || inputs.snapshot)
        working-directory: ${{ matrix.path }}
        run: |
          NEW_VERSION="${OLD_VERSION}-snapshot.$(date +%Y%m%d%H%M%S)"
          npm version "$NEW_VERSION" --no-git-tag-version
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Snapshot version: $NEW_VERSION"

      - name: Set Release Version
        if: steps.should_run.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && !inputs.snapshot
        working-directory: ${{ matrix.path }}
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          # The run on the version tag rebuilds the version the release run chose.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            npm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version
            echo "NEW_VERSION=$GITHUB_REF_NAME" >> $GITHUB_ENV
            exit 0
          fi
          IFS='.' read -r major minor patch <<< "$OLD_VERSION"
          NEW_VERSION=${NEW_VERSION:-$major.$minor.$((patch + 1))}
          case "$NEW_VERSION" in
            "$major.$minor.$((patch + 1))"|"$major.$((minor + 1)).0"|"$((major + 1)).0.0") echo "$OLD_VERSION → $NEW_VERSION" ;;
            *) echo "Invalid version bump: $OLD_VERSION → $NEW_VERSION"; exit 1 ;;
          esac
          npm version "$NEW_VERSION" --no-git-tag-version
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Check publish manifest
        if: steps.should_run.outputs.run == 'true'
        # No local (file:/link:/.yalc) specs may reach the registry - see the script.
        run: node openframe-frontend-core/scripts/check-publish-manifest.mjs "${{ matrix.path }}/package.json"

      # The tarball that is published; --ignore-scripts skips a prepack rebuild.
      - name: Pack ${{ env.NEW_VERSION }}
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        shell: bash
        run: echo "PACKAGE_TARBALL=$PWD/$(npm pack --ignore-scripts --json | jq -r '.[0].filename')" >> "$GITHUB_ENV"

      # THE registry of this package; needs the pkg.pr.new GitHub App. Nothing is published to npmjs.
      - name: Preview registry (pkg.pr.new) ${{ env.NEW_VERSION }}
        if: steps.should_run.outputs.run == 'true'
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          npm exec --no -- pkg-pr-new publish --no-compact --no-template --comment=off --json pkg-pr-new.json "$PACKAGE_TARBALL"
          jq -r '.packages[0].url' pkg-pr-new.json >> "$GITHUB_STEP_SUMMARY"

      # A RELEASE gets an address named after its version:
      #   https://pkg.pr.new/<owner>/<repo>/<package>@<x.y.z>
      # pkg.pr.new names a build after the git ref of the run that published it, so
      # the release is tagged `<x.y.z>` and this workflow is started once more on
      # that tag, where it builds the same commit under the same
      # version and publishes to pkg.pr.new only. A consumer pins that URL.
      - name: Publish the version address for ${{ env.NEW_VERSION }}
        if: steps.should_run.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && !inputs.snapshot && github.ref_type != 'tag'
        working-directory: ${{ matrix.path }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$NEW_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$NEW_VERSION"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$NEW_VERSION" -f target=node
          echo "Tagged \`$NEW_VERSION\`; https://pkg.pr.new/$GITHUB_REPOSITORY/$(jq -r '.name' package.json)@$NEW_VERSION is live when the run on that tag finishes." | tee -a "$GITHUB_STEP_SUMMARY"

  release-rust:
    name: Release Rust
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'rust' && !inputs.snapshot

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Previous Version
        run: |
          OLD_VERSION=$(git tag --list 'v*' | sed 's/^v//' | \
                        grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          OLD_VERSION=${OLD_VERSION:-0.0.0}
          echo "OLD_VERSION=$OLD_VERSION" >> $GITHUB_ENV
          echo "Found old version: $OLD_VERSION"

      - name: Set Release Version
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          IFS='.' read -r major minor patch <<< "$OLD_VERSION"
          NEW_VERSION=${NEW_VERSION:-$major.$minor.$((patch + 1))}
          case "$NEW_VERSION" in
            "$major.$minor.$((patch + 1))"|"$major.$((minor + 1)).0"|"$((major + 1)).0.0") echo "$OLD_VERSION → $NEW_VERSION" ;;
            *) echo "Invalid version bump: $OLD_VERSION → $NEW_VERSION"; exit 1 ;;
          esac
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Push Tag ${{ env.NEW_VERSION }}
        run: |
          TAG="v${{ env.NEW_VERSION }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — aborting."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed $TAG"
