[package]
name = "openframe-common"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
authors = ["Flamingo Team"]
description = "OpenFrame - code shared by the agent and the desktop apps"
license-file = "../../LICENSE.md"
repository = "https://github.com/flamingo-stack/openframe-oss-lib"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"

[features]
shared-token = ["dep:aes-gcm", "dep:anyhow"]
notify = [
    "dep:windows",
    "dep:winreg",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-user-notifications",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
aes-gcm = { version = "0.10", optional = true }
anyhow = { version = "1.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = [
    "Data_Xml_Dom",
    "Foundation_Collections",
    "UI_Notifications",
] }
winreg = { version = "0.52", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, features = [
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSError",
    "NSSet",
    "NSString",
] }
objc2-user-notifications = { version = "0.3.2", optional = true, features = [
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
