[package]
name = "openframe-common"
version = "0.1.0"
edition = "2021"
authors = ["Flamingo Team"]
description = "OpenFrame - code shared by the agent and the desktop apps"
license-file = "../../LICENSE.md"
repository = "https://github.com/flamingo-stack/openframe-oss-lib"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"

[features]
shared-token = ["dep:aes-gcm", "dep:anyhow"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
aes-gcm = { version = "0.10", optional = true }
anyhow = { version = "1.0", optional = true }
